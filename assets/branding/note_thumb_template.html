<!doctype html><html><head><meta charset="utf-8"><style>
  /* ============================================================
     note 見出し画像テンプレ（1280×670）
     使い回し：.hero（大見出し）/ .kicker（上の一言）/ .badge / .foot-tag の連番だけ差し替える。
     背景の初代バトル画面はブランド固定（回ごとに変えない）。

     PNG書き出し（Chromeヘッドレス・実寸）：
       "/c/Program Files/Google/Chrome/Application/chrome.exe" \
         --headless=new --disable-gpu --hide-scrollbars \
         --force-device-scale-factor=1 --window-size=1280,670 \
         --screenshot="D:/dev/tamagoyaki-game/assets/branding/note_thumb_XXX.png" \
         "D:/dev/tamagoyaki-game/assets/branding/note_thumb_template.html"
     ※出力先はプロジェクト内の絶対パスにすること（Tempフォルダはアクセス拒否される）
     ============================================================ */
  html,body{margin:0;padding:0}
  *{box-sizing:border-box}
  :root{--amber:#ffcc44;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",system-ui,sans-serif;}
  .thumb{position:relative;width:1280px;height:670px;background:#12141f;overflow:hidden}
  .screen{position:absolute;top:50%;left:0;width:1920px;height:1080px;
    transform:translateY(-50%) scale(.6667);transform-origin:left center;
    filter:blur(2px) saturate(.9);background:#12141f}
  .screen .r{position:absolute}
  .screen .l{position:absolute;line-height:1;white-space:nowrap;color:#fff;font-family:var(--gothic)}
  .scrim{position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(8,9,13,.55) 0%,rgba(8,9,13,.35) 40%,rgba(8,9,13,.78) 100%),
      radial-gradient(120% 90% at 50% 45%,rgba(8,9,13,0) 30%,rgba(8,9,13,.55) 100%)}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;
    justify-content:center;align-items:center;padding:44px 32px;text-align:center}
  .kicker{font-family:var(--gothic);font-weight:700;color:#fff;opacity:.92;
    font-size:34px;letter-spacing:.02em;margin-bottom:6px;text-shadow:0 2px 14px rgba(0,0,0,.75)}
  .kicker .amp{color:var(--amber)}
  .hero{font-family:var(--gothic);font-weight:900;color:#fff;white-space:nowrap;
    font-size:190px;line-height:.92;letter-spacing:-6px;
    text-shadow:0 6px 3px rgba(0,0,0,.35),0 10px 40px rgba(0,0,0,.8);
    -webkit-text-stroke:2px rgba(0,0,0,.28)}
  .foot-tag{position:absolute;left:56px;bottom:34px;font-family:var(--gothic);
    font-weight:700;font-size:26px;color:#fff;opacity:.9;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .foot-tag .dim{opacity:.62;font-weight:600}
  .badge{position:absolute;right:52px;bottom:34px;font-family:"Consolas",monospace;font-size:19px;
    color:#0c0d12;background:var(--amber);font-weight:700;padding:6px 14px;border-radius:999px;
    box-shadow:0 4px 18px rgba(0,0,0,.5)}
</style></head><body>
