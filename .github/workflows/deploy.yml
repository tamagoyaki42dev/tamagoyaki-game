name: Deploy to itch.io

on:
  push:
    branches:
      - main

env:
  GODOT_VERSION: "4.6"

jobs:
  export-and-deploy:
    name: Export HTML5 and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}.0
          use-dotnet: false

      - name: Install export templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          wget -q -O /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          mv /tmp/templates/* "$TEMPLATE_DIR/"

      - name: Import project
        run: godot --headless --import || true

      - name: Export HTML5
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" "$PWD/build/web/index.html"

      - name: Push to itch.io
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.ITCHIO_API_KEY }}
          CHANNEL: html5
          ITCH_USER: tamagoyaki42dev
          ITCH_GAME: tamagoyakigames
          PACKAGE: build/web
          VERSION: ${{ github.run_number }}
